# GoReleaser configuration (spec §15, NFR-6): static binaries for macOS
# (amd64/arm64), Linux (amd64/arm64), and Windows (amd64/arm64).
# CGO_ENABLED=0 keeps every artifact a self-contained static binary; the
# Linux builds are static and therefore run unchanged on both glibc and
# musl systems, and `go install` works from the tagged module.
# The scoop bucket update engages automatically once the
# SCOOP_GITHUB_TOKEN secret exists. The Homebrew formula is updated
# manually per release (bump version + source sha256 in the tap): a
# source-building formula is intentional, because macOS 26 stalls
# first launches of poured ad-hoc binaries at dyld.
version: 2

project_name: squint

builds:
  - id: squint
    builder: go
    main: ./cmd/squint
    binary: squint
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: squint
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks: []

scoops:
  - repository:
      owner: smhanov
      name: scoop-bucket
    homepage: "https://github.com/smhanov/squint"
    description: "Review what your LLM just committed, in a terminal UI"
    license: MIT
    skip_upload: '{{ envOrDefault "SCOOP_GITHUB_TOKEN" "" | eq "" }}'
