name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: build & test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Read-only git gate
        # squint never mutates a repository: the only git subcommands
        # internal/git may invoke are the read-only ones — log, status,
        # diff-tree, show, diff, rev-parse, for-each-ref, version, and
        # rev-list (rev-list is used read-only, for the since-diff
        # commit count). The gate greps production code for mutating
        # subcommand tokens (quoted, as exec arguments); test files and
        # the testfixture builder are exempt — fixtures must build
        # repositories.
        shell: bash
        run: |
          ! grep -rnE '"(commit|add|checkout|reset|push|pull|rebase|merge|tag|branch|stash|rm|mv|clean|init|clone|config|gc|prune|cherry-pick|revert|apply|am|bisect|worktree|submodule|notes|replace|restore|switch)"' internal/git --include='*.go' --exclude='*_test.go' --exclude-dir=testfixture

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: golangci/golangci-lint-action@v7
        with:
          args: --timeout 5m

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  snapshot:
    name: goreleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
