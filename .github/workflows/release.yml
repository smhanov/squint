name: release

# Tag-triggered release (spec §15): goreleaser builds the NFR-6 target
# matrix, publishes the GitHub release with archives and checksums, and
# updates the Homebrew tap and scoop bucket.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew tap / scoop bucket updates will need extra tokens
          # once the smhanov tap and bucket repositories exist.
